# Root CI for NexusOS. Nested workflows under ai-business-os/** are not
# discovered by GitHub Actions; this file wires the real stack paths.
#
# Backend gate is intentionally scoped: full `pytest -q` and full-app
# `ruff check app` fail on documented baseline debt already present on
# main @ 3207c42 (assistant/inventory/reports shape drift, migration
# harness initdb errors, unused-import F401s). We keep migrations/seed,
# security + tenant-isolation, and PR-focused regressions as merge gates.
name: CI

on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-business-os/ai-business-os/backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nexus
          POSTGRES_PASSWORD: nexus
          POSTGRES_DB: nexus
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nexus"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SECRET_KEY: ci-secret-key-must-be-32-chars-long!!!
      DATABASE_URL: postgresql+asyncpg://nexus:nexus@localhost:5432/nexus
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      # F401/F541/F841 baseline unused-import / unused-var debt on main (not PR-introduced).
      - run: ruff check app --ignore F401,F541,F841
      - name: Apply migrations (validates the schema end-to-end)
        run: alembic upgrade head
      - name: Seed permission catalog
        run: python -m app.db.seed
      - name: Security, tenant-isolation, and PR-focused regression tests
        run: >
          python -m pytest -q
          tests/security/
          tests/test_tenant_isolation.py
          tests/test_invoice_payment_summary_resilience.py
          tests/test_reports_enum_sql.py
          tests/test_unhandled_cors_headers.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-business-os/ai-business-os/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
